name: Validate Frontmatter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-frontmatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontmatter:
    name: Validate SKILL.md Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make script executable
        run: chmod +x scripts/validate-frontmatter.sh

      - name: Validate changed SKILL.md files
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^plugins/[^/]*/skills/[^/]*/SKILL\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No plugin SKILL.md files changed, skipping validation"
            exit 0
          fi
          echo "Validating changed plugin SKILL.md files:"
          echo "$CHANGED"
          FAILED=0
          for file in $CHANGED; do
            dir=$(dirname "$GITHUB_WORKSPACE/$file")
            echo "Validating: $dir"
            if ! ./scripts/validate-frontmatter.sh --dir "$dir" --quiet; then
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED skill(s) failed frontmatter validation"
            exit 1
          fi

      - name: Validate all SKILL.md frontmatter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/validate-frontmatter.sh

      - name: Summary
        if: always()
        run: |
          echo "### Frontmatter Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated installable plugin \`SKILL.md\` files in \`plugins/*/skills/*/\`" >> $GITHUB_STEP_SUMMARY
          echo "Run \`./scripts/validate-frontmatter.sh\` locally to check before pushing." >> $GITHUB_STEP_SUMMARY
